# Opinionated pandoc defaults for typeset research docs.
# Override any field by passing your own --defaults file at invocation time.

from: markdown
to: pdf

pdf-engine: xelatex

standalone: true
table-of-contents: true
toc-depth: 3
number-sections: true

# Tango is a high-contrast, accessible syntax theme that prints well in B/W.
highlight-style: tango

# Pandoc filters baked into the image at /opt/quill/filters/.
#
# dot2tikz.lua intercepts fenced ```dot blocks and rewrites them to raw TikZ
# via dot2tex (graphviz + dot2tex are installed in the image). The
# corresponding `\usepackage{tikz}` + library imports are declared below
# under variables.header-includes.
filters:
  - /opt/quill/filters/dot2tikz.lua

variables:
  documentclass: article
  papersize: a4
  fontsize: 11pt
  geometry:
    - margin=1in
  linestretch: 1.15

  # Typography is intentionally left to xelatex's default — Latin Modern, the
  # modern enhanced Computer Modern with full Unicode coverage. This is what
  # readers familiar with typeset academic docs expect. Custom fonts are out
  # of scope for the quill image; build a downstream image FROM quill (or
  # pandoc/latex) with the font installed and override mainfont/etc. in your
  # own --defaults YAML.

  # TikZ preamble for the dot2tikz filter output. Loaded unconditionally so a
  # document without any ```dot blocks still parses; the cost is one
  # \usepackage line in the LaTeX intermediate. `shapes` covers ellipse /
  # rectangle / circle nodes; `arrows.meta` enables the `-latex` arrow tip
  # dot2tex emits; `positioning` is broadly useful for hand-written tikz too.
  header-includes:
    - "\\usepackage{tikz}"
    - "\\usetikzlibrary{shapes,arrows.meta,positioning}"

  # Hyperref styling. colorlinks keeps clickable references visible without
  # the default boxed-link aesthetic.
  colorlinks: true
  linkcolor: "RoyalBlue"
  urlcolor: "RoyalBlue"
  citecolor: "ForestGreen"
  toccolor: "black"

  # Paragraph spacing — research docs are usually nicer with vertical gaps
  # than with first-line indents.
  indent: false
  parskip: "0.5em plus 0.1em minus 0.05em"
